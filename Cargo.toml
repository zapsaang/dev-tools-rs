[package]
name = "dev-tools"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dt"
path = "src/main.rs"

[workspace.metadata.dist]
binaries = ["dt"]

[workspace.metadata.dist.homebrew]
tap = "zapsaang/homebrew-tap"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
base64 = "0.21"
urlencoding = "2.1"
hex = "0.4"
anyhow = "1.0"
atty = "0.2"
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
rand = "0.8"
once_cell = "1.18"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
