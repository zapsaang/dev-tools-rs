name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  # cargo-dist 自动生成的逻辑，处理构建、打包、Hash、Github Release
  dist:
    name: Dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Release
        uses: axodotdev/cargo-dist-action@v1
        with:
          # 这里的 Token 用于上传 Release Assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
    # cargo-dist 会自动处理 Matrix (macOS-Intel, macOS-ARM, Linux, Windows)

  # 专门负责发布到 Homebrew 的 Job
  publish-homebrew:
    name: Publish to Homebrew
    needs: dist
    runs-on: ubuntu-latest
    env:
      # 需要在 Cargo.toml 中配置 [workspace.metadata.dist] formula = "dt" 等信息
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      
      # cargo-dist 的 plan 步骤会生成 formula 内容，这里只需要触发发布
      # 实际上，cargo-dist 现在的版本通常是在 'dist' job 里直接完成 formula 的上传
      # 你只需要在 Cargo.toml 里配置好 tap 仓库地址即可